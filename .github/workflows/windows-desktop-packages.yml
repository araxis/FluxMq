name: Windows Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/windows-desktop-packages.yml
      - src/**
      - tests/**
      - FluxMq.sln
      - Directory.Build.props
      - Directory.Build.targets
      - global.json
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - .github/workflows/windows-desktop-packages.yml
      - src/**
      - tests/**
      - FluxMq.sln
      - Directory.Build.props
      - Directory.Build.targets
      - global.json

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore workloads
        shell: pwsh
        timeout-minutes: 10
        run: dotnet workload restore src\FluxMq.UI\FluxMq.UI.csproj

      - name: Restore validation
        shell: pwsh
        timeout-minutes: 10
        run: dotnet restore FluxMq.sln

      - name: Test validation
        shell: pwsh
        timeout-minutes: 12
        run: |
          dotnet build FluxMq.sln --no-restore --disable-build-servers --verbosity minimal -m:1 -p:UseSharedCompilation=false -p:UseAppHost=false
          dotnet test tests\FluxMq.UI.Tests\FluxMq.UI.Tests.csproj --no-restore --no-build --disable-build-servers --verbosity minimal
