name: Windows Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate packaged desktop app
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore workloads
        shell: pwsh
        timeout-minutes: 10
        run: dotnet workload restore src\FluxMq.UI\FluxMq.UI.csproj

      - name: Restore release validation
        shell: pwsh
        timeout-minutes: 15
        run: dotnet restore FluxMq.sln -p:RuntimeIdentifierOverride=win-x64 -p:RuntimeIdentifier=win-x64

      - name: Test release validation
        shell: pwsh
        timeout-minutes: 30
        run: |
          $testProjects = @(
            "tests\FluxMq.Core.Tests\FluxMq.Core.Tests.csproj",
            "tests\FluxMq.Components.Tests\FluxMq.Components.Tests.csproj",
            "tests\FluxMq.App.Tests\FluxMq.App.Tests.csproj",
            "tests\FluxMq.Cli.Tests\FluxMq.Cli.Tests.csproj",
            "tests\FluxMq.UI.Tests\FluxMq.UI.Tests.csproj",
            "tests\FluxMq.Scenarios.Tests\FluxMq.Scenarios.Tests.csproj"
          )

          foreach ($project in $testProjects) {
            dotnet test $project --configuration Release --no-restore --disable-build-servers --verbosity minimal -p:RuntimeIdentifierOverride=win-x64 -p:RuntimeIdentifier=win-x64 -p:UseSharedCompilation=false --blame-hang --blame-hang-timeout 120s
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  package:
    name: Package Windows desktop app
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore workloads
        shell: pwsh
        run: dotnet workload restore src\FluxMq.UI\FluxMq.UI.csproj

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve package version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -match '^v?\d+\.\d+\.\d+$') {
            $version = "${{ github.ref_name }}".TrimStart([char[]]"vV")
          }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package
        shell: pwsh
        run: >
          .\eng\package-windows.ps1
          -Configuration Release
          -Version $env:PACKAGE_VERSION
          -ArtifactsPath "$env:RUNNER_TEMP\windows-packages"

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: FluxMQ-portable-win-x64
          path: ${{ runner.temp }}\windows-packages\dist\*-portable-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload MSI package
        uses: actions/upload-artifact@v7
        with:
          name: FluxMQ-msi-win-x64
          path: ${{ runner.temp }}\windows-packages\dist\*.msi
          if-no-files-found: error
          retention-days: 14
